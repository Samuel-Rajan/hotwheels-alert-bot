name: Hot Wheels Stock Checker

on:
  schedule:
    - cron: '3-59/5 * * * *'     # every 5 min at :03, :08, :13... (off the congested :00/:05 marks)
  workflow_dispatch:
    inputs:
      test_count:
        description: "Test mode: run the full alert + add-to-cart flow on the first N in-stock cars (0 = off)"
        required: false
        default: "0"

permissions:
  contents: write              # commit inventory.db
  actions: write               # keep the schedule from being auto-disabled

concurrency:
  group: hotwheels-checker
  cancel-in-progress: false

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Chromium
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" != "true" ]; then
            playwright install chromium
          fi
          playwright install-deps chromium

      - name: Run Bot Script
        timeout-minutes: 11
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PINCODE: ${{ secrets.PINCODE }}
          FIRSTCRY_STATE_B64: ${{ secrets.FIRSTCRY_STATE_B64 }}
          TEST_COUNT: ${{ github.event.inputs.test_count || '0' }}
        run: python main.py

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 1

      - name: Save Seen Products Database
        if: always()
        run: |
          # inventory.db is the only file the bot changes. If someone pushed to main while the run was going,
          # a plain push is rejected (non-fast-forward). So: rebuild the commit on top of the latest main and retry.
          [ -f inventory.db ] || { echo "No inventory.db"; exit 0; }
          cp inventory.db /tmp/inventory.db
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/inventory.db inventory.db
            git add inventory.db
            if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
            git commit -m "Update inventory state database"
            if git push origin HEAD:main; then exit 0; fi
            echo "Push rejected (attempt $i), retrying..."
            sleep $((i * 4))
          done
          echo "Could not push inventory.db after 5 attempts"
          exit 1

      - name: Keep scheduled workflow enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/checker.yml/enable" || true
